name: UI regression

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the regression pack
        run: npx playwright test

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload traces and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  dashboard:
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download the test summary
        id: summary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: test-results

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Record this run for the dashboard
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_RESULT: ${{ needs.test.result }}
        run: node .github/scripts/record-run.js

      - name: Upload the dashboard record
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-run
          path: dashboard-input/run.json
          if-no-files-found: error
